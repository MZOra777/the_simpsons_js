<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Simpsons</title>
    <!--Hoja de estilo-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--Contenido-->
    <header>
      <h1>THE SIMPSONS</h1>
      <img
        alt=""
        src="https://scontent.flpb3-1.fna.fbcdn.net/v/t39.30808-6/480246613_1051419003686997_3089903265517936337_n.jpg?_nc_cat=111&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=Yg2w7fn8LDcQ7kNvwE4W64E&_nc_oc=AdnHIC8ORuCZQ--W62jy8y5NcB55CGYuHnvTTButQYGA2yKwc6C4Tvs8ccXSSMF3s1U&_nc_zt=23&_nc_ht=scontent.flpb3-1.fna&_nc_gid=PYkA52jbBGaQsYSGhnt8bQ&oh=00_AfcLctuwa8G095hAOF86jTWKrKyLeKGYF3cX2up70UNHHA&oe=68F5F0E8"
      />
    </header>
    <section>
      <div class="card">
        <div id="character_image">
          <img id="image_url"
            src="https://scontent.flpb3-1.fna.fbcdn.net/v/t39.30808-6/480246613_1051419003686997_3089903265517936337_n.jpg?_nc_cat=111&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=Yg2w7fn8LDcQ7kNvwE4W64E&_nc_oc=AdnHIC8ORuCZQ--W62jy8y5NcB55CGYuHnvTTButQYGA2yKwc6C4Tvs8ccXSSMF3s1U&_nc_zt=23&_nc_ht=scontent.flpb3-1.fna&_nc_gid=PYkA52jbBGaQsYSGhnt8bQ&oh=00_AfcLctuwa8G095hAOF86jTWKrKyLeKGYF3cX2up70UNHHA&oe=68F5F0E8"
          />
        </div>
        <div id="character_data">
          <h2 id="name"></h2>
          <h2 id="age"> </h2>
          <h2 id="phrase"> </h2>
          
          
        </div>

        <button id="new_character_btn">NEXT</button>
      </div>
    </section>

    <!--Scripts-->
    <script src="script.js"></script>
  </body>
</html>
